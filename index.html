<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mechanical Dragonfly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e16;font-family:system-ui,-apple-system,sans-serif}
#c{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 26px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#e8eef8;pointer-events:none;z-index:10}
#ui .row{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;margin-bottom:8px}
button{background:#ff9a1a;color:#111;border:none;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px}
button.secondary{background:rgba(255,255,255,.14);color:#e8eef8}
#title{font-size:15px;font-weight:700;margin-bottom:4px}
#info{font-size:12px;opacity:.8}
#err{position:absolute;top:12px;left:12px;right:12px;color:#ff8a8a;font-size:13px;z-index:20;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="err"></div>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">Mechanical Dragonfly · 機械蜻蜓</div>
  <div class="row">
    <button id="btnFlap">拍翅中</button>
    <button id="btnCut" class="secondary">打開胸部</button>
    <button id="btnReset" class="secondary">重置視角</button>
  </div>
  <div id="info">拖曳旋轉 · 雙指/滾輪縮放</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  var errEl=document.getElementById('err');
  function showErr(m){errEl.style.display='block';errEl.textContent=m;console.error(m);}
  try{
    if(typeof THREE==='undefined'){showErr('Three.js 載入失敗');return;}

    var canvas=document.getElementById('c');
    var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(innerWidth,innerHeight);
    if(renderer.outputColorSpace!==undefined) renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.2;

    var scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0a0e16);

    var camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.5,500);
    var target=new THREE.Vector3(0,6,0);
    var spherical={radius:160, theta:0.7, phi:1.15};
    function updateCam(){
      camera.position.set(
        target.x + spherical.radius*Math.sin(spherical.phi)*Math.sin(spherical.theta),
        target.y + spherical.radius*Math.cos(spherical.phi),
        target.z + spherical.radius*Math.sin(spherical.phi)*Math.cos(spherical.theta)
      );
      camera.lookAt(target);
    }
    updateCam();

    var dragging=false, lastX=0, lastY=0, pointers={};
    canvas.addEventListener('pointerdown',function(e){
      pointers[e.pointerId]=[e.clientX,e.clientY];
      if(Object.keys(pointers).length===1){dragging=true;lastX=e.clientX;lastY=e.clientY;}
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove',function(e){
      if(!pointers[e.pointerId]) return;
      var ids=Object.keys(pointers);
      if(ids.length===1 && dragging){
        var dx=e.clientX-lastX, dy=e.clientY-lastY;
        lastX=e.clientX; lastY=e.clientY;
        spherical.theta -= dx*0.005;
        spherical.phi = Math.max(0.2, Math.min(Math.PI-0.2, spherical.phi+dy*0.005));
        updateCam();
      } else if(ids.length===2){
        var p0=pointers[ids[0]], p1=pointers[ids[1]];
        var prevDist=Math.hypot(p0[0]-p1[0], p0[1]-p1[1]);
        pointers[e.pointerId]=[e.clientX,e.clientY];
        p0=pointers[ids[0]]; p1=pointers[ids[1]];
        var dist=Math.hypot(p0[0]-p1[0], p0[1]-p1[1]);
        if(prevDist>0){
          spherical.radius *= prevDist/dist;
          spherical.radius=Math.max(50,Math.min(280,spherical.radius));
          updateCam();
        }
      }
    });
    function up(e){delete pointers[e.pointerId]; if(Object.keys(pointers).length===0) dragging=false;}
    canvas.addEventListener('pointerup',up);
    canvas.addEventListener('pointercancel',up);
    canvas.addEventListener('wheel',function(e){
      e.preventDefault();
      spherical.radius *= (e.deltaY>0?1.08:0.92);
      spherical.radius=Math.max(50,Math.min(280,spherical.radius));
      updateCam();
    },{passive:false});

    var key=new THREE.DirectionalLight(0xfff5e8,2.6); key.position.set(60,90,50); scene.add(key);
    var fill=new THREE.DirectionalLight(0x88b0ff,0.95); fill.position.set(-50,30,-40); scene.add(fill);
    var rim=new THREE.DirectionalLight(0xffb040,1.0); rim.position.set(-30,40,-80); scene.add(rim);
    scene.add(new THREE.HemisphereLight(0xc8d8ff,0x1a2030,0.55));
    scene.add(new THREE.AmbientLight(0x304050,0.5));

    var bodyMat=new THREE.MeshStandardMaterial({color:0x1c2636,roughness:0.45,metalness:0.15});
    var accentMat=new THREE.MeshStandardMaterial({color:0xff9a1a,roughness:0.28,metalness:0.4,emissive:0xff9a1a,emissiveIntensity:0.25});
    var steelMat=new THREE.MeshStandardMaterial({color:0xb8c0ce,roughness:0.28,metalness:0.7});
    var wingMat=new THREE.MeshStandardMaterial({color:0xd8e6f8,roughness:0.25,metalness:0.05,transparent:true,opacity:0.8,side:THREE.DoubleSide});
    var eyeMat=new THREE.MeshStandardMaterial({color:0x0a1018,roughness:0.2,emissive:0x152030,emissiveIntensity:0.35});

    var root=new THREE.Group(); scene.add(root);
    var thorax=new THREE.Mesh(new THREE.BoxGeometry(22,16,48),bodyMat); root.add(thorax);
    var head=new THREE.Mesh(new THREE.SphereGeometry(11,20,16),bodyMat); head.position.set(0,2,34); root.add(head);
    [-1,1].forEach(function(sx){
      var eye=new THREE.Mesh(new THREE.SphereGeometry(6.2,14,12),eyeMat);
      eye.position.set(sx*8.5,4,38); eye.scale.set(1,1.2,0.9); root.add(eye);
    });
    for(var i=0;i<7;i++){
      var t=i/6, r=6.5*(1-t*0.72);
      var seg=new THREE.Mesh(new THREE.CylinderGeometry(r*0.95,r,12,12),bodyMat);
      seg.rotation.x=Math.PI/2; seg.position.z=-28-i*12; root.add(seg);
    }
    [[-1,10,22],[1,10,22],[-1,-2,20],[1,-2,20],[-1,-14,18],[1,-14,18]].forEach(function(item){
      var sx=item[0],z=item[1],len=item[2];
      var leg=new THREE.Group();
      var u=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.55,len*0.45,6),steelMat);
      u.position.y=-len*0.2; u.rotation.z=sx*0.5; leg.add(u);
      var l=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.35,len*0.4,6),steelMat);
      l.position.set(sx*6,-len*0.5,0); l.rotation.z=sx*0.85; leg.add(l);
      leg.position.set(sx*10,-8,z); root.add(leg);
    });
    var shaft=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,42,12),steelMat);
    shaft.rotation.x=Math.PI/2; root.add(shaft);
    var disks=[];
    [-14,14].forEach(function(z){
      var d=new THREE.Mesh(new THREE.CylinderGeometry(9,9,3.5,24),accentMat);
      d.rotation.x=Math.PI/2; d.position.z=z; root.add(d); disks.push(d);
    });
    function makeWing(side,isFore){
      var g=new THREE.Group();
      var span=isFore?85:78;
      var shape=new THREE.Shape();
      shape.moveTo(0,0);
      shape.quadraticCurveTo(span*0.35,28,span*0.9,7);
      shape.quadraticCurveTo(span,0,span*0.92,-9);
      shape.quadraticCurveTo(span*0.5,-20,span*0.15,-7);
      shape.lineTo(0,0);
      var mem=new THREE.Mesh(new THREE.ShapeGeometry(shape,6),wingMat);
      mem.rotation.x=-Math.PI/2; if(side<0) mem.scale.x=-1; g.add(mem);
      var spar=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.65,span*0.95,6),steelMat);
      spar.rotation.z=Math.PI/2; spar.position.set(side*span*0.47,0.8,0); g.add(spar);
      return g;
    }
    var wings={}, rods={};
    [['FL',-1,true,12],['FR',1,true,12],['HL',-1,false,-12],['HR',1,false,-12]].forEach(function(item){
      var key=item[0],side=item[1],isFore=item[2],z=item[3];
      var w=makeWing(side,isFore); w.position.set(side*14,10,z); root.add(w); wings[key]=w;
      var rod=new THREE.Mesh(new THREE.CylinderGeometry(1,1,20,6),accentMat); root.add(rod); rods[key]=rod;
    });

    var flapping=true, cutaway=0, targetCut=0, time=0;
    function update(th){
      var flapF=Math.sin(th)*0.75, flapH=Math.sin(th+Math.PI*0.5)*0.75;
      shaft.rotation.z=th; disks.forEach(function(d){d.rotation.z=th;});
      [['FL',flapF,-1,12],['FR',flapF,1,12],['HL',flapH,-1,-12],['HR',flapH,1,-12]].forEach(function(item){
        var key=item[0],flap=item[1],side=item[2],z=item[3];
        var w=wings[key]; w.rotation.z=flap; w.position.y=10+Math.sin(Math.abs(flap))*2.5;
        var rod=rods[key], tipX=side*14, tipY=w.position.y;
        rod.position.set(tipX*0.5, tipY*0.5, z);
        var len=Math.hypot(tipX,tipY)||1; rod.scale.y=len/20; rod.rotation.z=Math.atan2(tipY,tipX)-Math.PI/2;
      });
      cutaway+=(targetCut-cutaway)*0.08;
      thorax.material.transparent=cutaway>0.02;
      thorax.material.opacity=1-cutaway*0.88;
      thorax.material.depthWrite=cutaway<0.5;
    }

    document.getElementById('btnFlap').onclick=function(){
      flapping=!flapping; this.textContent=flapping?'拍翅中':'已暫停'; this.className=flapping?'':'secondary';
    };
    document.getElementById('btnCut').onclick=function(){
      targetCut=targetCut>0.5?0:1; this.textContent=targetCut>0.5?'關閉胸部':'打開胸部'; this.className=targetCut>0.5?'':'secondary';
    };
    document.getElementById('btnReset').onclick=function(){
      spherical.radius=160; spherical.theta=0.7; spherical.phi=1.15; updateCam();
    };
    addEventListener('resize',function(){
      camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    var last=performance.now();
    function animate(now){
      requestAnimationFrame(animate);
      var dt=Math.min(0.05,(now-last)/1000); last=now;
      if(flapping) time+=dt;
      update(time*2.2);
      renderer.render(scene,camera);
    }
    requestAnimationFrame(animate);
  }catch(e){showErr(String(e&&e.message?e.message:e));}
})();
</script>
</body>
</html>
